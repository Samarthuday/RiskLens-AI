[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "risklens-ai"
version = "0.1.0"
description = "Evidence-driven transaction surveillance demo built on a pinned quantitative research foundation."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "joblib>=1.4,<2",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
  "duckdb>=1.2,<2",
  "pyarrow>=19,<25",
  "shap>=0.46,<1",
  "python-dotenv>=1,<2",
  "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]
mcp = ["mcp>=1.2,<2"]

[tool.setuptools.packages.find]
include = ["app*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
